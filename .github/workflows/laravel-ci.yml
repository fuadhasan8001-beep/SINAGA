name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3, xml, zip
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Install frontend dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Laravel tests
        run: php artisan test
